<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Firewall — AgenticStore{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
</head>

<body>
  <header>
    <div class="header-inner">
      <span class="logo">
        <img src="/static/logo.svg" alt="AgenticStore Logo" style="width: 24px; height: 24px; margin-right: 4px;" />
        <span class="logo-accent">AgenticStore</span>
      </span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <a href="https://github.com/agenticstore/agentic-store-mcp" target="_blank">GitHub</a>
    &nbsp;·&nbsp;
    <a href="https://agenticstore.dev" target="_blank">AgenticStore.dev</a>
  </footer>

  <script src="/static/app.js?v=audit-details-3"></script>
</body>

</html>
